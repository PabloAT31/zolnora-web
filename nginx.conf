# Zolnora — configuración de la página web (zolnora-web), 22 oct 2026.
# Reemplaza la configuración por defecto de nginx. Objetivo: que el servidor
# envíe cabeceras de seguridad básicas y que solo salgan las páginas públicas.
#
# IMPORTANTE: no pongas `add_header` dentro de un bloque `location`: nginx
# descarta entonces TODAS las cabeceras de seguridad de más arriba.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # No anunciar la versión de nginx en las respuestas.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    # --- Cabeceras de seguridad (en todas las respuestas, también en errores) ---
    # Que el navegador no "adivine" tipos de archivo.
    add_header X-Content-Type-Options "nosniff" always;
    # Que nadie meta la página dentro de otra (clickjacking).
    add_header X-Frame-Options "DENY" always;
    # No contar a otros sitios desde qué página llegó la persona.
    add_header Referrer-Policy "no-referrer" always;
    # La web no necesita cámara, micrófono, ubicación, etc.
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Solo se permite lo que las páginas realmente usan: estilos escritos dentro
    # de la propia página e imágenes incrustadas. Sin scripts, sin fuentes ni
    # recursos de terceros, sin formularios.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    # Obliga a usar HTTPS (180 días). Sin includeSubDomains ni preload a propósito.
    add_header Strict-Transport-Security "max-age=15552000" always;

    # --- Solo contenido público ---
    # Nada de archivos ocultos (.git, .env, .htaccess...).
    location ~ /\. {
        return 404;
    }
    # Archivos del despliegue que nunca deben verse desde fuera.
    location ~* ^/(Dockerfile|nginx\.conf|README.*|ZOLNORA-web)$ {
        return 404;
    }
    location / {
        # /privacidad también abre privacidad.html.
        try_files $uri $uri.html $uri/ =404;
    }
}

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Correo confirmado — Zolnora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --background: #FAFAF9;
    --surface: #FFFFFF;
    --border: #E7E5E4;
    --text-primary: #1C1917;
    --text-secondary: #78716C;
    --primary: #2563EB;
    --success: #16A34A;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--background);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  body {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
  }
  .badge {
    width: 64px;
    height: 64px;
    border-radius: 999px;
    background: #EFFAF3;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  .badge svg { width: 30px; height: 30px; }
  .brand {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 16px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 12px;
  }
  p {
    font-size: 15px;
    line-height: 1.5;
    color: var(--text-secondary);
    margin: 0 0 4px;
  }
  .hint {
    margin-top: 24px;
    font-size: 13px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 6L9 17l-5-5" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand">Zolnora</div>
    <h1>Tu correo quedó confirmado</h1>
    <p>Ya puedes cerrar esta ventana y volver a abrir la app Zolnora en tu celular.</p>
    <p>Entra con el mismo correo y la contraseña que creaste.</p>
    <div class="hint">Si tienes algún problema, escríbenos a zolnora.oficial@gmail.com</div>
  </div>
</body>
</html>
